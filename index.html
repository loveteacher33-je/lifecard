<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생 뽑기 카드 - 도덕 수업 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 sm:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-xl w-full glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl space-y-8 border border-white/50 text-center">
        
        <div class="space-y-3">
            <span class="inline-block px-3.5 py-1.5 bg-indigo-100 text-indigo-700 font-extrabold text-xs rounded-full shadow-sm">
                초등 5학년 도덕 - 정의로운 공동체
            </span>
            <h1 class="text-3xl font-black text-gray-800 tracking-tight">🎲 인생 뽑기 카드</h1>
            <p class="text-xs font-semibold text-gray-500 leading-relaxed">
                역할 교체와 퍼스널 카드를 통해 다양성을 이해하고<br>정의로운 사회의 원칙을 함께 탐구하는 실시간 도덕 수업 앱
            </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
            <!-- 학생용 접속 -->
            <a href="student.html" class="group relative bg-gradient-to-br from-indigo-500 to-indigo-700 hover:from-indigo-600 hover:to-indigo-800 text-white p-6 rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 flex flex-col items-center justify-between space-y-4">
                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                    👨‍🎓
                </div>
                <div class="space-y-1 text-center">
                    <h2 class="text-lg font-black">학생용 접속</h2>
                    <p class="text-[11px] text-indigo-100 font-medium">태블릿으로 카드 뽑기 & 투표 참여</p>
                </div>
                <span class="w-full py-2.5 bg-white/20 hover:bg-white/30 rounded-xl text-xs font-bold transition">
                    수업 참여하기 🚀
                </span>
            </a>

            <!-- 교사 대시보드 -->
            <a href="teacher.html" class="group relative bg-gradient-to-br from-purple-600 to-slate-800 hover:from-purple-700 hover:to-slate-900 text-white p-6 rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 flex flex-col items-center justify-between space-y-4">
                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                    📊
                </div>
                <div class="space-y-1 text-center">
                    <h2 class="text-lg font-black">교사 대시보드</h2>
                    <p class="text-[11px] text-purple-200 font-medium">실시간 통합 제어 & 결과 모니터링</p>
                </div>
                <span class="w-full py-2.5 bg-white/20 hover:bg-white/30 rounded-xl text-xs font-bold transition">
                    대시보드 열기 🔓
                </span>
            </a>
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-between items-center text-[11px] text-gray-400 font-bold">
            <span>🏫 초등 도덕 수업용 웹앱</span>
            <span>⚡ 실시간 웹소켓 연동 지원</span>
        </div>

    </div>

</body>
</html>
